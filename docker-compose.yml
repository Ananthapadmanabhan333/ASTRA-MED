# ASTRA-MED: PostgreSQL + FastAPI monitoring engine + Next.js dashboard.
# Copy .env.example to .env first; credentials come only from that file.
#   docker compose up --build
# Dashboard: http://localhost:3000   API docs: http://localhost:8000/docs
# Local stack only (HTTP on localhost). For a public deployment see docs/DEPLOYMENT.md.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-astra_med}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TRAIN_MODELS: "0"  # faster local builds; models train once on first start into the volume
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASTRA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-astra_med}
      ASTRA_ENVIRONMENT: ${ASTRA_ENVIRONMENT:-docker}
      ASTRA_LOG_LEVEL: ${ASTRA_LOG_LEVEL:-INFO}
      ASTRA_CORS_ORIGINS: ${ASTRA_CORS_ORIGINS:-http://localhost:3000}
      ASTRA_RANDOM_EVENTS_PER_HOUR: ${ASTRA_RANDOM_EVENTS_PER_HOUR:-6}
      ASTRA_SIMULATION_CONTROL_ENABLED: ${ASTRA_SIMULATION_CONTROL_ENABLED:-true}
      ASTRA_NASA_API_KEY: ${ASTRA_NASA_API_KEY:-}  # optional; server side only
      ASTRA_SPACE_SYNC_ENABLED: ${ASTRA_SPACE_SYNC_ENABLED:-true}
      ASTRA_AUTH_ENABLED: ${ASTRA_AUTH_ENABLED:-true}
      ASTRA_AUTH_COOKIE_SECURE: ${ASTRA_AUTH_COOKIE_SECURE:-false}  # true behind HTTPS
      ASTRA_ASSISTANT_MODE: ${ASTRA_ASSISTANT_MODE:-extractive}
      ASTRA_DB_SCHEMA_MODE: migrate  # schema owned by Alembic
      ASTRA_MIGRATE_ON_START: "true"  # single instance: apply migrations before the API starts
    volumes:
      - ai-artifacts:/app/artifacts  # trained model versions persist across restarts
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  ai-artifacts:
