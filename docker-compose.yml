# ASTRA-MED: PostgreSQL + FastAPI monitoring engine + Next.js dashboard.
# Copy .env.example to .env first; credentials come only from that file.
#   docker compose up --build
# Dashboard: http://localhost:3000   API docs: http://localhost:8000/docs

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-astra_med}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASTRA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-astra_med}
      ASTRA_ENVIRONMENT: ${ASTRA_ENVIRONMENT:-docker}
      ASTRA_LOG_LEVEL: ${ASTRA_LOG_LEVEL:-INFO}
      ASTRA_CORS_ORIGINS: ${ASTRA_CORS_ORIGINS:-http://localhost:3000}
      ASTRA_RANDOM_EVENTS_PER_HOUR: ${ASTRA_RANDOM_EVENTS_PER_HOUR:-6}
      ASTRA_SIMULATION_CONTROL_ENABLED: ${ASTRA_SIMULATION_CONTROL_ENABLED:-true}
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
