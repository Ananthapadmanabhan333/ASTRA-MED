# Alembic configuration for the ASTRA-MED database schema.
#
#   cd backend
#   alembic upgrade head                 # bring a database to the latest schema (run before each deploy)
#   alembic current                      # show the database's revision
#   alembic downgrade -1                 # roll back one revision
#   alembic revision --autogenerate -m "describe the change"   # after editing app/db/models.py
#
# The database URL comes from ASTRA_DATABASE_URL (the same setting the API uses), never from here.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
